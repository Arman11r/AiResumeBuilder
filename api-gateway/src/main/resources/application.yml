server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties], optional:file:./.env[.properties]
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ── Microservice API routes ──────────────────────────────────────────
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: resume-service
          uri: http://localhost:8082
          predicates:
            - Path=/resumes/**

        - id: section-service
          uri: http://localhost:8083
          predicates:
            - Path=/sections/**

        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/ai/**

        - id: template-service
          uri: http://localhost:8085
          predicates:
            - Path=/templates/**

        - id: export-service
          uri: http://localhost:8086
          predicates:
            - Path=/exports/**

        - id: jobmatch-service
          uri: http://localhost:8087
          predicates:
            - Path=/job-matches/**

        - id: notification-service
          uri: http://localhost:8088
          predicates:
            - Path=/notifications/**

        # ── Swagger /v3/api-docs proxy routes ────────────────────────────────
        - id: auth-service-swagger
          uri: http://localhost:8081
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

        - id: resume-service-swagger
          uri: http://localhost:8082
          predicates:
            - Path=/resume-service/v3/api-docs
          filters:
            - RewritePath=/resume-service/v3/api-docs, /v3/api-docs

        - id: section-service-swagger
          uri: http://localhost:8083
          predicates:
            - Path=/section-service/v3/api-docs
          filters:
            - RewritePath=/section-service/v3/api-docs, /v3/api-docs

        - id: ai-service-swagger
          uri: http://localhost:8084
          predicates:
            - Path=/ai-service/v3/api-docs
          filters:
            - RewritePath=/ai-service/v3/api-docs, /v3/api-docs

        - id: template-service-swagger
          uri: http://localhost:8085
          predicates:
            - Path=/template-service/v3/api-docs
          filters:
            - RewritePath=/template-service/v3/api-docs, /v3/api-docs

        - id: export-service-swagger
          uri: http://localhost:8086
          predicates:
            - Path=/export-service/v3/api-docs
          filters:
            - RewritePath=/export-service/v3/api-docs, /v3/api-docs

        - id: jobmatch-service-swagger
          uri: http://localhost:8087
          predicates:
            - Path=/jobmatch-service/v3/api-docs
          filters:
            - RewritePath=/jobmatch-service/v3/api-docs, /v3/api-docs

        - id: notification-service-swagger
          uri: http://localhost:8088
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:resumeai-super-secret-key-change-in-production-2026}

# ── SpringDoc / Swagger aggregation on the Gateway ─────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Resume Service
        url: /resume-service/v3/api-docs
      - name: Section Service
        url: /section-service/v3/api-docs
      - name: AI Service
        url: /ai-service/v3/api-docs
      - name: Template Service
        url: /template-service/v3/api-docs
      - name: Export Service
        url: /export-service/v3/api-docs
      - name: JobMatch Service
        url: /jobmatch-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
  api-docs:
    enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG