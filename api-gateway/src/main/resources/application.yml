server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: resume-service
          uri: http://localhost:8082
          predicates:
            - Path=/resumes/**

        - id: section-service
          uri: http://localhost:8083
          predicates:
            - Path=/sections/**

        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/ai/**

        - id: template-service
          uri: http://localhost:8085
          predicates:
            - Path=/templates/**

        - id: export-service
          uri: http://localhost:8086
          predicates:
            - Path=/exports/**

        - id: jobmatch-service
          uri: http://localhost:8087
          predicates:
            - Path=/job-matches/**

        - id: notification-service
          uri: http://localhost:8088
          predicates:
            - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: resumeai-super-secret-key-change-in-production-2026

logging:
  level:
    org.springframework.cloud.gateway: DEBUG