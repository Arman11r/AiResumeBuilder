server:
  port: 8086

spring:
  application:
    name: export-service

  datasource:
    url: jdbc:mysql://localhost:3306/resumeai_export?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: resumeai-super-secret-key-change-in-production-2026

services:
  resume-url: http://localhost:8082
  section-url: http://localhost:8083
  template-url: http://localhost:8085
  notification-url: http://localhost:8088

export:
  storage:
    local-path: /tmp/resumeai-exports

management:
  endpoints:
    web:
      exposure:
        include: health,info