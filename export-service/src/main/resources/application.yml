server:
  port: 8086

spring:
  config:
    import: optional:file:../.env[.properties], optional:file:./.env[.properties]
  application:
    name: export-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/resumeai_export?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:resumeai-super-secret-key-change-in-production-2026}

services:
  resume-url: http://${RESUME_SERVICE_HOST:localhost}:8082
  section-url: http://${SECTION_SERVICE_HOST:localhost}:8083
  template-url: http://${TEMPLATE_SERVICE_HOST:localhost}:8085
  notification-url: http://${NOTIFICATION_SERVICE_HOST:localhost}:8088

export:
  storage:
    local-path: ${EXPORT_STORAGE_LOCAL_PATH:/tmp/resumeai-exports}

rabbitmq:
  exchange:
    notification: notification_exchange
  routing:
    export-completed: export.completed

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html