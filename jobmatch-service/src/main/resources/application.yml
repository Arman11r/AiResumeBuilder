server:
  port: 8087

spring:
  config:
    import: optional:file:../.env[.properties], optional:file:./.env[.properties]
  application:
    name: jobmatch-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/resumeai_jobmatch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Redis ─────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:resumeai-super-secret-key-change-in-production-2026}

services:
  resume-url: http://${RESUME_SERVICE_HOST:localhost}:8082
  ai-url: http://${AI_SERVICE_HOST:localhost}:8084

# ──────────────────────────────────────────────────────────
# Job Portal API Keys (via RapidAPI — https://rapidapi.com)
# ──────────────────────────────────────────────────────────
# When key is blank the service falls back to realistic mock data.
jobmatch:
  rapidapi:
    key: ${RAPIDAPI_KEY:}
    jsearch-host: jsearch.p.rapidapi.com
    jsearch-url: https://jsearch.p.rapidapi.com/search

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html